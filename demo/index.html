<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poznan App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: jedna kolona širine telefona, lepljivo zaglavlje, donja navigacija, sheet forme odozdo */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E8EEEC; --line:#D7E0DD;
  --fg:#13201C; --muted:#5B6D68; --accent:#0A6B63; --accent-fg:#FFFFFF; --accent-soft:#D9EEEA;
  --good:#1D7A4C; --good-soft:#DDF2E6; --warn:#A86200; --warn-soft:#FBEBD2; --bad:#BF342D; --bad-soft:#F9DFDC;
  --info:#2D5DA8; --info-soft:#DFE8F7; --bar-out:#B9C6C2; --scrim:rgba(10,22,19,.45);
  --av-a:#0A6B63; --av-b:#8A4A16;
  --lc0:#B4531A; --lc1:#2D5DA8; --lc2:#7A4FB0; --lc3:#1D7A4C; --lc4:#A8326A; --lc5:#7C6A12;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px; --r-sm:10px; --nav-h:66px; --w:460px;
  --gut-l:max(16px, env(safe-area-inset-left,0px)); --gut-r:max(16px, env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1C2926; --line:#283633;
  --fg:#E4EDEA; --muted:#93A6A0; --accent:#43C0B2; --accent-fg:#05211E; --accent-soft:#143530;
  --good:#53C48D; --good-soft:#153325; --warn:#EFA63A; --warn-soft:#3A2A10; --bad:#F2766C; --bad-soft:#3D1D1A;
  --info:#7FA7EA; --info-soft:#1A2740; --bar-out:#3E504B; --scrim:rgba(0,0,0,.6);
  --av-a:#2E9C90; --av-b:#C27a3A; --lc0:#F09A5E; --lc1:#7FA7EA; --lc2:#B99AE8; --lc3:#53C48D; --lc4:#E784B4; --lc5:#D3BE5A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1C2926; --line:#283633;
  --fg:#E4EDEA; --muted:#93A6A0; --accent:#43C0B2; --accent-fg:#05211E; --accent-soft:#143530;
  --good:#53C48D; --good-soft:#153325; --warn:#EFA63A; --warn-soft:#3A2A10; --bad:#F2766C; --bad-soft:#3D1D1A;
  --info:#7FA7EA; --info-soft:#1A2740; --bar-out:#3E504B; --scrim:rgba(0,0,0,.6);
  --av-a:#2E9C90; --av-b:#C27a3A; --lc0:#F09A5E; --lc1:#7FA7EA; --lc2:#B99AE8; --lc3:#53C48D; --lc4:#E784B4; --lc5:#D3BE5A; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{overflow-x:clip}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}

.app{max-width:var(--w);margin:0 auto;min-height:100%;background:var(--bg)}
@media (min-width:520px){.app{border-inline:1px solid var(--line)}}
.screen{padding-left:var(--gut-l);padding-right:var(--gut-r);padding-bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

/* Zaglavlje */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px;margin-inline:calc(-1 * var(--gut-l)) calc(-1 * var(--gut-r));padding-left:var(--gut-l);padding-right:var(--gut-r);border-bottom:1px solid transparent}
.top-title{flex:1;min-width:0}
.top h1{font-size:24px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-sub{color:var(--muted);font-size:13px;margin-top:2px}
.top-right{display:flex;gap:8px;align-items:center}
.cur-tg{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:999px;padding:5px 10px;font-weight:700;font-size:13px;min-width:46px}
.cur-tg:hover{background:var(--accent-soft)}
.card.bal{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.amt-row{align-items:end}.amt-row input{height:46px}
.cur-seg{height:46px}.cur-seg label{display:flex;align-items:center;justify-content:center}
.sal-who[hidden]{display:none}
.sal-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sal-sum > div{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.sal-sum span{display:block;font-size:12.5px;color:var(--muted)}.sal-sum b{display:block;font-variant-numeric:tabular-nums;font-size:15px;overflow-wrap:anywhere}
.sal-t{display:grid;grid-template-columns:48px repeat(3,minmax(0,1fr));column-gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.sal-t > :not(:first-child){text-align:right}.sal-t:not(.head) > *{white-space:nowrap}.sal-t small{display:block;font-size:11.5px;color:var(--muted)}
.list > .sal-t:first-child{border-top:0}.sal-t.head{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2)}.sal-t.tot{font-weight:700;background:var(--surface-2)}
.sal-card{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;color:inherit;font:inherit;cursor:pointer}
.apick{position:relative}
.apick-btn,.apick-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 12px 6px 6px;cursor:pointer;min-height:46px}
.apick-btn[aria-expanded="true"]{border-color:var(--accent)}
.apick-t{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.25}.apick-t b{font-size:14.5px}.apick-t small{font-size:12.5px;color:var(--muted)}
.apick-list{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);display:flex;flex-direction:column;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.apick-list[hidden]{display:none}
.apick-opt{border:0;background:none;border-radius:10px}.apick-opt:hover{background:var(--surface-2)}.apick-opt[aria-selected="true"]{background:var(--accent-soft)}.apick-opt svg{color:var(--accent)}
.bal .kv{align-items:center}.bal-n{display:flex;align-items:center;gap:8px}.bal-n .co-ic{transform:scale(.8)}
.bal .neg{color:var(--bad)}.bal-tot{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-weight:700;font-size:16px}
.row-amt.tr{color:var(--accent)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg)}
.icon-btn.accent{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.avatar{width:40px;height:40px;border-radius:50%;border:0;color:#fff;font-weight:700;display:grid;place-items:center;font-size:15px}
.av-nenad{background:var(--av-a)} .av-jovan{background:var(--av-b)}
.av-sm{width:32px;height:32px;font-size:13px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}

/* Donja navigacija */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,var(--w));z-index:7;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px max(6px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px, env(safe-area-inset-left,0px))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;color:var(--muted);border-radius:12px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.nav button[aria-current="page"] .ic{background:var(--accent-soft);border-radius:10px;padding:3px 10px;box-sizing:content-box}
.nav button.nav-add .nav-ic{position:relative;display:inline-flex;background:var(--accent-soft);border-radius:10px;padding:3px 10px;box-sizing:content-box}
.nav button.nav-add .nav-ic > .ic{opacity:1;color:var(--accent);background:none;padding:0;border-radius:0}
.nav button.nav-add > span:last-child{white-space:nowrap}
.nav button.nav-add .nav-ic-badge{position:absolute;inset:0;display:grid;place-items:center;background:none;color:var(--fg)}
.nav button.nav-add .nav-ic-badge .ic{opacity:1;width:22px;height:22px;color:var(--fg);background:none;padding:0}
.fab{position:fixed;z-index:8;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.22);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));right:calc(max(16px, (100vw - var(--w)) / 2 + 16px) + env(safe-area-inset-right,0px))}

/* Osnovni elementi */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h:has(> .btn){align-items:center}
.sec-h h2{font-size:17px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}
.muted{color:var(--muted)} .small{font-size:13px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.btn{border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:11px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.ph-aktivna{background:var(--good-soft);color:var(--good)}
.ph-osnivanje{background:var(--info-soft);color:var(--info)}
.ph-mirovanje{background:var(--warn-soft);color:var(--warn)}
.ph-zatvorena,.ph-neaktivna{background:var(--surface-2);color:var(--muted)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--muted);white-space:nowrap}
.tag.kes{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .cnt{opacity:.65;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg label,.seg button{position:relative;display:block;text-align:center;border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked),.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg label:has(input:disabled){opacity:.45}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}

/* KPI */
.kpi-hero{background:var(--accent);color:var(--accent-fg);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.kpi-hero .label{color:inherit;opacity:.8}
.kpi-hero .big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.kpi-row > div{background:color-mix(in srgb, var(--accent-fg) 12%, transparent);border-radius:12px;padding:10px 12px;min-width:0}
.kpi-row b{display:block;font-size:17px;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}

/* Upozorenja */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:0;border-radius:14px;padding:12px 14px;background:var(--surface-2);color:var(--fg)}
.alert .ic{margin-top:2px}
.alert b{display:block;font-size:14.5px}
.alert span{font-size:13px;color:var(--muted)}
.alert.bad{background:var(--bad-soft)} .alert.bad .ic{color:var(--bad)}
.alert.warn{background:var(--warn-soft)} .alert.warn .ic{color:var(--warn)}
.alert.info{background:var(--info-soft)} .alert.info .ic{color:var(--info)}
.alert.good{background:var(--good-soft)} .alert.good .ic{color:var(--good)}

/* Liste */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;width:100%;text-align:left;border-top:1px solid var(--line)}
.list > .row:first-child,.list > :first-child .row{border-top:0}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px;margin-top:2px}
.row-amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.row-amt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.ini{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:var(--muted);flex:none;font-size:14px}
.month-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 0}
.month-h b{font-family:var(--f-display);font-size:15px;text-transform:capitalize}

/* Firme */
.co-card{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.co-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.co-title{display:flex;gap:12px;align-items:center;min-width:0}
.co-ic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);color:var(--fg);display:grid;place-items:center;flex:none;overflow:hidden}
.co-ic img{width:100%;height:100%;object-fit:cover;display:block}
.co-ic.kes{background:var(--warn-soft);color:var(--warn)}
.co-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.co-opt{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer;min-width:0}
.co-opt input{position:absolute;opacity:0;pointer-events:none}
.co-opt b{font-size:13.5px;line-height:1.2;overflow-wrap:anywhere}
.co-opt small{font-size:12px;color:var(--muted)}.co-opt small b{font-size:12.5px;color:var(--fg);font-variant-numeric:tabular-nums}.co-opt small.lim-w b{color:var(--warn)}.co-opt small.neg b{color:var(--bad)}#txForm:not(.is-out) .sub-out,#txForm.is-out .sub-in{display:none}
.co-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.co-opt:has(input:checked) .co-ic:not(.logo){background:var(--accent);color:var(--accent-fg)}
.co-opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.icon-pick{display:flex;gap:8px;flex-wrap:wrap}
.ip{position:relative;display:block}
.ip input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.ip span{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--bg)}
.ip input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.logo-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pos-tabs button{display:flex;align-items:center;justify-content:center;gap:6px}
.row-link.kontakt{display:flex;align-items:center;gap:12px}
.client-box{gap:12px}
.pay-lines{display:flex;flex-direction:column;gap:10px}
.pay-actions{flex-wrap:wrap}
.ph-ch{grid-column:1/-1;margin:4px 0 0;padding:0;list-style:none;font-size:13px;display:flex;flex-direction:column;gap:2px}
.ph-ch del{color:var(--bad);opacity:.85} .ph-ch ins{color:var(--good);text-decoration:none}
.phase-now{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--muted)}
.phase-now b{color:var(--fg)}
.phase-now .link{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:0}
.phase-hist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ph-row{display:grid;grid-template-columns:auto 1fr;column-gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:13.5px}
.ph-row:first-child{border-top:0}
.ph-row span{color:var(--muted)}
.ph-row small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.ph-row.cur b{color:var(--accent)}
.contact .rem{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:13px}
.contact .rem .cmt-del{margin-left:auto}
.pay-actions .btn{flex:1 1 45%}
.btn.warn-btn{background:var(--warn-soft);border-color:var(--warn-soft);color:var(--warn)}
.pay-line{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pay-total{border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.inv-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.inv-overlay{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:12px var(--gut-r) 40px var(--gut-l)}
.inv-bar{position:sticky;top:0;display:flex;gap:8px;justify-content:flex-end;padding:4px 0 12px;background:var(--bg);z-index:1}
.invoice{position:relative;max-width:720px;margin:0 auto;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:28px;font-size:14px;display:flex;flex-direction:column;gap:20px;overflow:hidden}
.inv-demo{position:absolute;top:14px;right:-38px;transform:rotate(35deg);background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:12px;padding:3px 44px;letter-spacing:.08em;text-transform:uppercase}
.inv-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.inv-co{font-family:var(--f-display);font-size:20px;font-weight:700}
.inv-title{text-align:right}.inv-title b{font-family:var(--f-display);font-size:24px;letter-spacing:.04em}
.inv-meta{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0}
.inv-meta span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.inv-meta span:first-child{margin-top:0}
.inv-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.inv-table th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px 4px}
.inv-table td{padding:8px 4px;border-bottom:1px solid var(--line)}
.inv-table th:nth-child(n+2),.inv-table td:nth-child(n+2){text-align:right}

.lim{display:block;width:100%;border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit}
.lim-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;margin-bottom:4px}
.lim-used{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar.lg{height:22px}
.lim-name{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 10px;font-size:12px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lim-name.on{color:var(--accent-fg)}
.lim-amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.lim.m-warn .lim-amt{color:var(--warn)} .lim.m-bad .lim-amt{color:var(--bad)}
.lim.custom .bar i{background:var(--c)}
.dotc.auto{background:conic-gradient(var(--good) 0 34%,var(--warn) 0 67%,var(--bad) 0)}
.sw-btn.auto span{background:conic-gradient(var(--good) 0 34%,var(--warn) 0 67%,var(--bad) 0)}
.bar.sm{height:6px}
.earn{display:flex;flex-direction:column;gap:12px}
.earn .big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.earn-sub{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.earn-sub b{color:var(--fg);font-variant-numeric:tabular-nums}
.earn-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.earn-tiles button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--fg)}
.earn-tiles button span{font-size:12px;color:var(--muted)}
.earn-tiles button b{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.earn-tiles button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.earn-tiles button[aria-pressed="true"] span{color:inherit;opacity:.85}
.earn-out{display:flex;flex-direction:column;gap:12px}
.pick{display:grid;gap:8px;align-items:stretch}
.pick-m{grid-template-columns:auto minmax(0,1.5fr) minmax(0,1fr) auto}
.pick-y{grid-template-columns:auto minmax(0,1fr) auto}
.icon-btn[disabled]{opacity:.35;cursor:default}
.pill.sm{padding:1px 8px;font-size:12px}
.row-link{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit;display:block}
.call-btn{border:0;cursor:pointer;width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;text-decoration:none}
.row-title{display:flex;align-items:center;flex-wrap:wrap;column-gap:8px;row-gap:3px;min-width:0}
.row-title b{max-width:100%}
.logout-ic{color:var(--bad);background:var(--bad-soft)}
.form-err{margin:0;color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:500}
.empty{text-align:center;color:var(--muted);padding:28px 16px;font-size:14px}
.settings-sec{display:flex;flex-direction:column;gap:12px}
.backup-item{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:8px 0;border-top:1px solid var(--line)}
.backup-item:first-child{border-top:0}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite}

@keyframes up{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

function pausalProjection(ytd){
  const dim=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0).getDate();
  const el=TODAY.getMonth()+TODAY.getDate()/dim; if(el<=0||ytd<=0)return null;
  const avg=ytd/el, proj=avg*12, lim=S.settings.pausalLimit;
  return {avg,proj,reachMonth:proj>lim?Math.floor(lim/avg):null};
}
function pdvPeriod(){
  const d=TODAY.getDate()<=15?new Date(TODAY.getFullYear(),TODAY.getMonth()-1,1):new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  const deadline=new Date(d.getFullYear(),d.getMonth()+1,15);
  const days=Math.round((deadline-new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()))/864e5);
  return {period:d,deadline,days,key:iso(d).slice(0,7)};
}
function vatFor(cid,key){
  const t=S.tx.filter(x=>x.companyId===cid&&x.date.startsWith(key));
  const out=t.filter(x=>x.type==='prihod').reduce((s,x)=>s+x.amount*(x.vat||0)/100,0);

  return {out,inn,diff:out-inn,invoices:t.filter(x=>x.type==='prihod').length};
}

function chart(filterFn=()=>true){
  const keys=[];for(let i=5;i>=0;i--){const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-i,1);keys.push([iso(d).slice(0,7),MONTHS[d.getMonth()]]);}
  const data=keys.map(([k,l])=>{const t=S.tx.filter(x=>x.date.startsWith(k)&&filterFn(x));return {l,inc:sum(t.filter(x=>x.type==='prihod')),out:sum(t.filter(x=>x.type==='trosak'))};});
  const raw=Math.max(1,...data.map(d=>Math.max(d.inc,d.out)));
  const mag=Math.pow(10,Math.floor(Math.log10(raw))),nr=raw/mag; const max=(nr<=1?1:nr<=2?2:nr<=2.5?2.5:nr<=5?5:10)*mag;
  const W=330,H=180,x0=44,x1=W-6,y0=12,y1=H-26,ph=y1-y0,gw=(x1-x0)/6;
  const y=v=>y1-v/max*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Prihodi i troškovi po mesecima">`;
  [0,.5,1].forEach(f=>{const v=max*f;s+=`<line class="grid" x1="${x0}" x2="${x1}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${x0-6}" y="${y(v)+3}" text-anchor="end">${short(v)}</text>`;});
  const pts=[];
  data.forEach((d,i)=>{const cx=x0+gw*i+gw/2,bw=gw*.3;
    s+=`<rect class="b-in" x="${cx-bw-1}" y="${y(d.inc)}" width="${bw}" height="${y1-y(d.inc)}" rx="2"><title>${d.l}: prihod ${rsd(d.inc)}</title></rect>`;
    s+=`<rect class="b-out" x="${cx+1}" y="${y(d.out)}" width="${bw}" height="${y1-y(d.out)}" rx="2"><title>${d.l}: troškovi ${rsd(d.out)}</title></rect>`;
    s+=`<text class="axis" x="${cx}" y="${H-8}" text-anchor="middle">${d.l}</text>`;
    pts.push([cx,y(Math.max(0,d.inc-d.out))]);});
  s+=`<polyline class="p-line" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
  pts.forEach((p,i)=>{s+=`<circle class="p-dot" cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?3.6:2.4}"/>`;});
  return `<div class="legend"><span><i style="background:var(--accent)"></i>Prihodi</span><span><i style="background:var(--bar-out)"></i>Troškovi</span><span><i style="background:var(--fg);height:2px;width:12px;vertical-align:3px"></i>Profit</span></div><div class="chart">${s}</svg></div>`;
}

async function hashPw(user,pw){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('poznan:'+user+':'+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  catch(e){let h=0;const s='poznan:'+user+':'+pw;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 'f'+h;}
}

/* ---------- Glas: prepoznavanje + simulirani AI parser ---------- */
let rec=null;
function vStatus(t){const n=$('#voiceStatus');if(n)n.textContent=t;}
function micToggle(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){vStatus('Ovaj pregledač ne podržava prepoznavanje govora. Otkucaj komandu ili izaberi primer.');return;}
  if(rec){rec.stop();return;}
  rec=new SR();rec.lang='sr-RS';rec.interimResults=true;rec.continuous=false;
  const btn=$('#micBtn');
  rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;$('#voiceText').value=t;};
  rec.onerror=e=>{vStatus(e.error==='not-allowed'||e.error==='service-not-allowed'?'Mikrofon nije dozvoljen ovde. Otkucaj komandu ili izaberi primer.':e.error==='no-speech'?'Nisam čuo ništa. Pokušaj ponovo.':'Prepoznavanje nije uspelo. Otkucaj komandu ili izaberi primer.');};
  rec.onend=()=>{rec=null;btn&&btn.classList.remove('rec');if(($('#voiceText')?.value||'').trim())vStatus('Proveri tekst, pa dodirni „Obradi komandu“.');};
  try{rec.start();btn.classList.add('rec');vStatus('Slušam…');}catch(e){rec=null;vStatus('Mikrofon nije dostupan. Otkucaj komandu ili izaberi primer.');}
}
const GEN={petra:'Petar',marka:'Marko',nikole:'Nikola',jovana:'Jovan',milana:'Milan',stefana:'Stefan',nenada:'Nenad',dragana:'Dragan',ivana:'Ivan',aleksandra:'Aleksandar',milosa:'Miloš',dusana:'Dušan',luke:'Luka',vladimira:'Vladimir',djordja:'Đorđe',zorana:'Zoran',nemanje:'Nemanja',bojana:'Bojan',gorana:'Goran',dejana:'Dejan'};
const CITY={loznice:'Loznica',sapca:'Šabac',valjeva:'Valjevo',beograda:'Beograd','novog sada':'Novi Sad',nisa:'Niš',kragujevca:'Kragujevac',zvornika:'Zvornik',bijeljine:'Bijeljina','banje koviljace':'Banja Koviljača',krupnja:'Krupanj',ljubovije:'Ljubovija',uba:'Ub',obrenovca:'Obrenovac'};
const STOP='(?=\\s*,|\\s+(?:iz|ulica|ulici|adresa|mobilni|mobilnog|telefon|broj|u komentar|komentar|u opis|opis|napomena)\\b|$)';
function nomName(str){
  const w=str.trim().split(/\s+/).slice(0,3);const fem=/u$/i.test(w[0]);
  return w.map((x,i)=>{const n=norm(x);let o=x;
    if(fem){if(/u$/i.test(x))o=x.slice(0,-1)+'a';}
    else if(GEN[n])o=GEN[n];
    else if(/ića$/i.test(x)||/ica$/i.test(n)&&i>0)o=x.slice(0,-1);
    else if(i>0&&/(ova|eva|ina)$/i.test(x))o=x.slice(0,-1);
    else if(i>0&&/a$/i.test(x)&&x.length>4)o=x.slice(0,-1);
    return cap(o);}).join(' ');
}
function nomCity(s){const n=norm(s.trim());if(CITY[n])return CITY[n];if(/ice$/.test(n))return cap(s.trim().slice(0,-1)+'a');return cap(s.trim());}
function parseVoice(text){
  const t=text.trim().replace(/[„“”"]/g,'');const low=norm(t);
  if(/(prihod|trosak|troskov)/.test(low)){
    const type=/(trosak|troskov)/.test(low)?'trosak':'prihod';
    let amount=0;const m=t.match(/(\d[\d.\s]*(?:,\d+)?)\s*(hiljad\w*|hilj\.?|k\b|milion\w*)?/i);
    if(m){amount=parseFloat(m[1].replace(/[\s.]/g,'').replace(',','.'))||0;if(m[2]&&/^h|^k/i.test(m[2]))amount*=1000;if(m[2]&&/^mil/i.test(m[2]))amount*=1e6;}
    const comp=S.companies.find(c=>{const ws=norm(c.name).split(/\s+/).filter(w=>w.length>3&&!['poznan','doo'].includes(w));return ws.some(w=>low.includes(w))||low.includes(norm(c.name));});
    const kes=/(kes|gotovin|bez racuna)/.test(low);
    let cl=null;const km=t.match(/(?:\bklijent\w*|\bod|\bza)\s+([A-ZČĆŠŽĐ][\wčćšžđ]+\s+[A-ZČĆŠŽĐ][\wčćšžđ]+)/);
    if(km){const nm=norm(nomName(km[1]));cl=S.clients.find(k=>norm(k.name)===nm)||S.clients.find(k=>norm(k.name).split(' ')[1]?.slice(0,4)===nm.split(' ')[1]?.slice(0,4));}
    const cats=catsOf(type);const cat=cats.find(c=>low.includes(norm(c).slice(0,5)))||(type==='prihod'?'Usluga':'Ostalo');
    const dm=t.match(/\bza\s+(?!firmu)([^,]+)$/i);
    return {intent:'tx',data:{type,amount,companyId:kes?null:(comp?.id||null),payment:kes||!comp?'kes':'faktura',clientId:cl?.id||null,category:cat,vat:comp?.form==='pdv'?20:0,date:TODAY_ISO,description:dm?cap(dm[1].replace(/\s+za firmu.*$/i,'').trim()):''}};
  }
  if(/klijent/.test(low)||/(kreiraj|dodaj|napravi|unesi)/.test(low)){
    const nm=t.match(new RegExp('klijent(?:a|kinju|kinja)?\\s+(.+?)'+STOP,'i'));
    const cm=t.match(new RegExp('iz mesta\\s+(.+?)'+STOP,'i'))||t.match(new RegExp('\\biz\\s+(.+?)'+STOP,'i'));
    const am=t.match(new RegExp('(?:ulica|ulici|adresa)\\s+(.+?)'+STOP,'i'));
    const pm=t.match(/(?:mobilni|mobilnog|telefon|broj(?: telefona)?)\s*:?\s*(\+?[\d][\d\s\/-]{5,}\d)/i);
    const em=t.match(/[\w.+-]+@[\w-]+\.[\w.]+/);
    const dm=t.match(/(?:u komentar stavi|komentar je|komentar|u opis stavi|opis je|opis|napomena)\s*:?\s*(.+)$/i);
    if(!nm)return null;
    return {intent:'client',data:{name:nomName(nm[1]),city:cm?(/iz mesta/i.test(cm[0])?cap(cm[1].trim()):nomCity(cm[1])):'',address:am?cap(am[1].trim()):'',phone:pm?pm[1].replace(/[\s\/-]/g,''):'',email:em?em[0]:'',description:dm?cap(dm[1].trim().replace(/\.$/,'')+'.'):''}};
  }
  return null;
}

function readImage(file,max=900,type='image/jpeg'){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL(type,.78));};img.onerror=rej;img.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}

function labelFromForm(e){const v=e.label.value;if(v!=='__new')return v;const n=e.newLabel.value.trim();if(!n){toast('Unesi naziv nove kategorije.');return null;}const ex=S.labels.find(l=>norm(l.name)===norm(n));if(ex)return ex.id;const l={id:uid(),name:cap(n),c:S.labels.length%6};S.labels.push(l);return l.id;}
const CLIENT_F=[['kind','Vrsta klijenta',v=>KIND[v||'fizicko']],['name','Ime'],['pib','PIB'],['mb','Matični broj'],['city','Mesto'],['address','Adresa'],['phone','Mobilni'],['email','Email'],['note','Napomena']];
function newClient(d){const k={id:uid(),...d,createdAt:Date.now()};S.clients.push(k);log('klijent','kreirano',k.name,[{field:'Vrsta',from:'',to:KIND[k.kind]},k.city&&{field:'Mesto',from:'',to:k.city},k.phone&&{field:'Mobilni',from:'',to:k.phone}].filter(Boolean));return k;}
const parseNum=s=>parseFloat(String(s||'').replace(/\s/g,'').replace(/\./g,'').replace(',','.'))||0;
const F={
  transfer:f=>{const e=f.elements,from=e.from.value,to=e.to.value,cur=e.currency.value,orig=parseNum(e.amount.value);
    if(!from||!to)return toast('Izaberi oba računa.');if(from===to)return toast('Izaberi dva različita računa.');if(!(orig>0))return toast('Unesi iznos veći od nule.');
    const rate=cur==='EUR'?fxRate():1,x={id:uid(),from,to,amount:Math.round(orig*rate*100)/100,currency:cur,amountOriginal:orig,fxRate:rate,date:e.date.value||TODAY_ISO,note:e.note.value.trim(),by:S.session,ts:Date.now()};
    const low=balanceOf(from)<x.amount;(S.transfers=S.transfers||[]).push(x);
    log('transakcija','kreirano',`Prenos ${acctName(from)} → ${acctName(to)} · ${curAmt(orig,cur)}`,[{field:'Sa računa',from:'',to:acctName(from)},{field:'Na račun',from:'',to:acctName(to)}]);save();closeSheet();render();
    toast(low?`Prenos je sačuvan. Na računu ${acctName(from)} je sada minus.`:'Prenos je sačuvan.');},
  // Demo: lozinke se ne proveravaju, samo se prikazuje tok. Prava provera ide u aplikaciju (Supabase Auth).
  resetPass:f=>{const e=f.elements,u=ui.pickUser;if(!/^\d{6,8}$/.test(e.code.value.trim()))return toast('Kod iz emaila ima 6 do 8 cifara.');const pp=pwProblem(e.p1.value,e.p2.value);if(pp)return toast(pp);
    (S.auth=S.auth||{})[u]={hash:'demo',setAt:Date.now()};ui.resetFor=null;ui.loginErr='';S.session=u;log('nalog','reset lozinke',`Reset lozinke, nalog ${userName(u)}`,[{field:'Način',from:'',to:'Kod iz emaila'}],u);log('nalog','prijava','Prijava na aplikaciju');save();go('dashboard');toast('Lozinka je postavljena.');checkStartPrompts();},
  changePass:f=>{const e=f.elements;if(!e.cur.value)return toast('Upiši trenutnu lozinku.');const pp=pwProblem(e.p1.value,e.p2.value);if(pp)return toast(pp);
    (S.auth=S.auth||{})[S.session]={hash:'demo',setAt:Date.now()};log('nalog','promenjena lozinka','Lozinka promenjena');save();go('vise');toast('Lozinka je promenjena.');},
  txCat:f=>{const t=ui.tcType||'prihod',name=cap(f.elements.name.value.trim());if(!name)return toast('Unesi naziv kategorije.');
    if(catsOf(t).some(c=>norm(c)===norm(name)))return toast('Kategorija sa tim nazivom već postoji.');
    S.txCats=S.txCats||{prihod:[...CAT_IN],trosak:[...CAT_OUT]};S.txCats[t]=[...catsOf(t),name];log('podesavanja','kreirano',`Kategorija prometa: ${name}`,[{field:'Vrsta',from:'',to:t==='prihod'?'Prihod':'Trošak'}]);save();render();toast('Kategorija je dodata.');},
  login:()=>{const u=ui.pickUser;ui.loginErr="";S.session=u;log("nalog","prijava","Prijava na aplikaciju");save();go("dashboard");checkStartPrompts();},
  setPass:()=>{const u=ui.pickUser;S.auth[u]={hash:"demo",setAt:Date.now()};ui.loginErr="";S.session=u;log("nalog","postavljena lozinka","Lozinka postavljena");log("nalog","prijava","Prijava na aplikaciju");save();go("dashboard");toast("Lozinka je postavljena.");checkStartPrompts();},
  client:f=>{const e=f.elements,id=f.dataset.id,kind=e.kind.value||'fizicko';const d={kind,pib:kind==='pravno'?e.pib.value.trim():'',mb:kind==='pravno'?e.mb.value.trim():'',name:e.name.value.trim(),city:e.city.value.trim(),address:e.address.value.trim(),phone:e.phone.value.trim(),email:e.email.value.trim(),note:e.note.value.trim()};
    if(!d.name)return toast(kind==='pravno'?'Unesi naziv firme.':'Unesi ime klijenta.');
    if(id){const k=client(id);const ch=diff(k,d,CLIENT_F);if(ch.length){log('klijent','izmenjeno',d.name,ch);Object.assign(k,d);save();}closeSheet();go('klijent',id);toast(ch.length?'Klijent je sačuvan.':'Nema izmena.');}
    else{const k=newClient(d);const tx=f.dataset.tx&&S.tx.find(x=>x.id===f.dataset.tx);
      if(tx){tx.clientId=k.id;delete tx.pendingClient;log('transakcija','izmenjeno',`${tx.type==='prihod'?'Prihod':'Trošak'} ${curAmt(tx.amountOriginal??tx.amount,tx.currency||'RSD')}`,[{field:'Klijent',from:'—',to:k.name}]);save();closeSheet();render();toast(`Klijent je dodat i povezan sa unosom.`);return;}
      save();closeSheet();go('klijent',k.id);toast('Klijent je dodat.');}},
  posao:f=>{const e=f.elements,id=f.dataset.id;let cid=e.clientId.value;
    const other=e.otherAddr.checked;const d={startDate:e.startDate.value,startTime:e.startDate.value?e.startTime.value:'',endTime:e.startDate.value?e.endTime.value:'',description:e.description.value.trim(),workAddress:other?e.workAddress.value.trim():'',workCity:other?e.workCity.value.trim():'',assignee:e.assignee.value||'oba',...(e.endDate?{endDate:e.endDate.value}:{})};
    if(!cid&&!e.name.value.trim())return toast('Upiši klijenta ili ga izaberi iz pretrage.');
    if(d.endDate&&d.startDate&&d.endDate<d.startDate)return toast('Završetak ne može biti pre početka.');
    d.label=labelFromForm(e);if(d.label===null)return;
    if(!cid){const kind=e.kind.value||'fizicko';cid=newClient({kind,pib:kind==='pravno'?e.pib.value.trim():'',mb:kind==='pravno'?e.mb.value.trim():'',name:e.name.value.trim(),city:e.city.value.trim(),address:e.address.value.trim(),phone:e.phone.value.trim(),email:e.email.value.trim(),note:''}).id;}
    d.clientId=cid;

function calDay(){

/* Posao je počeo kad prođe datum početka, a ako je upisano i vreme, tek kad dođe to vreme tog dana */
const hasStarted=k=>{if(!k.startDate||k.startDate>TODAY_ISO)return false;if(k.startDate<TODAY_ISO||!k.startTime)return true;const n=new Date();return `${pad(n.getHours())}:${pad(n.getMinutes())}`>=k.startTime;};
const startAsked=()=>{const u=S.session,p=S.prefs[u]=S.prefs[u]||{};return p.startAsked=p.startAsked||{};};
function markStartAsked(id){const k=posao(id);if(k){startAsked()[id]=k.startDate+(k.startTime||'');save();}}
function checkStartPrompts(){
  fireReminders();
  if(!S.session||$('#sheetRoot').innerHTML)return;
  const asked=startAsked();
  const k=S.poslovi.filter(k=>!k.archived&&jobStatus(k)==='cekanje'&&hasStarted(k)&&asked[k.id]!==k.startDate+(k.startTime||'')).sort((a,b)=>a.startDate.localeCompare(b.startDate))[0];
  if(!k)return;
  const cat=k.label?lbl(k.label).name:'';
  openSheet('Posao je počeo',`<div class="form"><p style="margin:0">Da li da prebacim <b>${esc(client(k.clientId)?.name||'posao')}</b>${cat?` · ${esc(cat)}`:''} u „U procesu“?</p>
  <p class="small muted" style="margin:0">Početak: ${relDay(k.startDate)}${k.startTime?' u '+k.startTime:''}. Trenutni status: Na čekanju.</p>
  <div class="form-actions"><button class="btn" data-act="startNo" data-id="${k.id}">Ne sada</button><button class="btn primary" data-act="startYes" data-id="${k.id}">Prebaci u U procesu</button></div></div>`);
}
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{const f=e.target.closest?.('form[data-sig]');if(f)dirtyCheck(f);}));
render();
checkStartPrompts();
setInterval(checkStartPrompts,60000);
// Srednji kurs NBS za danas; ako mreža nije dostupna, ostaje poslednji sačuvan kurs
fetch('https://kurs.resenje.org/api/v1/currencies/eur/rates/today').then(r=>r.json()).then(j=>{if(j&&j.exchange_middle>0&&(!S.fx||S.fx.date!==j.date_from||S.fx.eur!==j.exchange_middle)){S.fx={date:j.date_from,eur:j.exchange_middle};save();if(!$('#sheetRoot').innerHTML)render();}}).catch(()=>{}); // ako je aplikacija otvorena kad dođe vreme početka
</script>
</body>
</html>
